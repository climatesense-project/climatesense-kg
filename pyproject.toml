[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climatesense-kg"
version = "0.1.0"
description = "A modular, source-agnostic pipeline for building the ClimateSense knowledge graphs"
authors = [{ name = "ClimateSense", email = "climatesense@lists.eurecom.fr" }]
requires-python = ">=3.11.0, <3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "psycopg[binary, pool]>=3.3.4,<4",
    "trafilatura>=2.2.0,<3",
    "requests>=2.34.2,<3",
    "pyyaml>=6.0.3,<7",
    "rdflib>=7.6.0,<8",
    "defusedxml>=0.7.1,<0.8",
    "dacite>=1.9.2,<2",
    "tqdm>=4.70.0,<5",
    "python-dotenv>=1.2.2,<2",
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.2,<0.53",
    "sqlalchemy>=2.0.52,<3",
    "asyncpg>=0.31.0,<0.32",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
climatesense-kg = "climatesense_kg.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.2,<0.17",
    "pytest>=9.1.1,<10",
    "ty==0.0.71",
    "pre-commit>=4.6.2,<5",
]

[tool.hatch.build.targets.sdist]
include = ["src/climatesense_kg"]

[tool.hatch.build.targets.wheel]
include = ["src/climatesense_kg"]

[tool.hatch.build.targets.wheel.sources]
"src/climatesense_kg" = "climatesense_kg"

[tool.ty.src]
include = ["src", "tests"]
