volumes:
  virtuoso_data:
  qlever_data:
  qlever_ui_data:
  postgres_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: climatesense-postgres
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climatesense_cache}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-climatesense_cache}",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.16
    container_name: climatesense-virtuoso
    env_file: .env
    environment:
      DBA_PASSWORD: ${VIRTUOSO_PASSWORD:-dba}
      SPARQL_UPDATE: true
    ports:
      - "${VIRTUOSO_PORT:-8890}:8890"
      - "${VIRTUOSO_ISQL_PORT:-1111}:1111"
    volumes:
      - virtuoso_data:/database
      - ./virtuoso/initdb.d:/initdb.d:ro
      - ../data:/database/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8890/sparql || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - virtuoso

  isql-service:
    build:
      context: ./isql-service
      dockerfile: Dockerfile
    container_name: climatesense-isql
    environment:
      VIRTUOSO_HOST: virtuoso
      VIRTUOSO_ISQL_PORT: 1111
      VIRTUOSO_USER: dba
      VIRTUOSO_PASSWORD: ${VIRTUOSO_PASSWORD:-dba}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${VIRTUOSO_ISQL_SERVICE_PORT:-8080}:8080"
    depends_on:
      - virtuoso
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - virtuoso

  qlever-volume-init:
    image: alpine:3.22
    container_name: climatesense-qlever-volume-init
    command:
      - sh
      - -c
      - chown -R ${QLEVER_UID:-999}:${QLEVER_GID:-999} /data
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
    restart: "no"
    profiles:
      - qlever
      - qlever-init

  qlever-index:
    image: docker.io/adfreiburg/qlever:commit-8d7945d
    container_name: climatesense-qlever-index
    working_dir: /data
    env_file: .env
    environment:
      UID: ${QLEVER_UID:-999}
      GID: ${QLEVER_GID:-999}
      QLEVER_INDEX_MEMORY: ${QLEVER_INDEX_MEMORY:-1G}
    command:
      - -c
      - >-
        qlever index
        --stxxl-memory "${QLEVER_INDEX_MEMORY:-1G}"
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
      - ./qlever/Qleverfile:/data/Qleverfile:ro
      - ../data:/data/source:ro
    depends_on:
      qlever-volume-init:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - qlever-init

  qlever:
    image: docker.io/adfreiburg/qlever:commit-8d7945d
    container_name: climatesense-qlever
    working_dir: /data
    env_file: .env
    environment:
      UID: ${QLEVER_UID:-999}
      GID: ${QLEVER_GID:-999}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-}
      QLEVER_MEMORY_FOR_QUERIES: ${QLEVER_MEMORY_FOR_QUERIES:-5G}
      QLEVER_CACHE_MAX_SIZE: ${QLEVER_CACHE_MAX_SIZE:-2G}
      QLEVER_QUERY_TIMEOUT: ${QLEVER_QUERY_TIMEOUT:-30s}
    command:
      - -c
      - >-
        qlever start
        --run-in-foreground
        --access-token "${QLEVER_ACCESS_TOKEN:-}"
        --memory-for-queries "${QLEVER_MEMORY_FOR_QUERIES:-5G}"
        --cache-max-size "${QLEVER_CACHE_MAX_SIZE:-2G}"
        --timeout "${QLEVER_QUERY_TIMEOUT:-30s}"
    ports:
      - "${QLEVER_PORT:-7019}:7019"
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
      - ./qlever/Qleverfile:/data/Qleverfile:ro
    depends_on:
      qlever-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -G -H 'Accept: application/sparql-results+json' --data-urlencode 'query=ASK { ?s ?p ?o }' http://localhost:7019 >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles:
      - qlever

  qlever-ui-app:
    build:
      context: ./qlever-ui
      dockerfile: Dockerfile
    container_name: climatesense-qlever-ui-app
    env_file: .env
    environment:
      QLEVERUI_SECRET_KEY: ${QLEVERUI_SECRET_KEY:-}
      QLEVERUI_DEBUG: ${QLEVERUI_DEBUG:-False}
      QLEVERUI_ALLOWED_HOSTS: ${QLEVERUI_ALLOWED_HOSTS:-localhost,127.0.0.1}
      QLEVERUI_CSRF_TRUSTED_ORIGINS: ${QLEVERUI_CSRF_TRUSTED_ORIGINS:-http://localhost:7018}
      QLEVER_UI_BACKEND_URL: ${QLEVER_UI_BACKEND_URL:-http://localhost:7018/qlever}
    command:
      - sh
      - -c
      - |
        if [ -z "$$QLEVERUI_SECRET_KEY" ]; then
          echo "QLEVERUI_SECRET_KEY is required" >&2
          exit 1
        fi
        python manage.py migrate --noinput
        python manage.py shell < /opt/climatesense/bootstrap.py
        exec gunicorn --bind :7000 --workers 3 --limit-request-line 10000 qlever.wsgi:application
    volumes:
      - qlever_ui_data:/app/db
    depends_on:
      qlever:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7000/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - qlever

  qlever-ui:
    image: nginx:1.29-alpine
    container_name: climatesense-qlever-ui
    ports:
      - "${QLEVER_UI_PORT:-7018}:7000"
    volumes:
      - ./qlever-ui/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      qlever:
        condition: service_healthy
      qlever-ui-app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7000/ >/dev/null && wget --header='Accept: application/sparql-results+json' -qO- 'http://127.0.0.1:7000/qlever?query=ASK%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D' >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - qlever

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: climatesense-pipeline
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-climatesense_cache}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      VIRTUOSO_HOST: ${VIRTUOSO_HOST:-virtuoso}
      VIRTUOSO_PORT: ${VIRTUOSO_PORT:-8890}
      VIRTUOSO_USER: ${VIRTUOSO_USER:-dba}
      VIRTUOSO_PASSWORD: ${VIRTUOSO_PASSWORD:-dba}
      VIRTUOSO_ISQL_SERVICE_URL: http://isql-service:8080
      QLEVER_ENDPOINT: ${QLEVER_ENDPOINT:-http://qlever:7019}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-}
      QLEVER_UPLOAD_TIMEOUT_SECONDS: ${QLEVER_UPLOAD_TIMEOUT_SECONDS:-7200}
      CIMPLE_FACTORS_API_URL: ${CIMPLE_FACTORS_API_URL:-http://localhost:8000}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../cache:/app/cache
      - ../config:/app/config:ro
    profiles:
      - manual

  analytics-api:
    build:
      context: ..
      dockerfile: docker/analytics-api.Dockerfile
    container_name: climatesense-analytics-api
    environment:
      ANALYTICS_SPARQL_ENDPOINT: ${ANALYTICS_SPARQL_ENDPOINT:-http://virtuoso:8890/sparql}
      ANALYTICS_SPARQL_USER: ${ANALYTICS_SPARQL_USER:-}
      ANALYTICS_SPARQL_PASSWORD: ${ANALYTICS_SPARQL_PASSWORD:-}
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:-http://localhost:3000}
      ANALYTICS_SPARQL_TIMEOUT: ${ANALYTICS_SPARQL_TIMEOUT:-20}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-climatesense_cache}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - postgres
    ports:
      - "${ANALYTICS_API_PORT:-8000}:8000"
    restart: unless-stopped

  analytics-ui:
    build:
      context: ..
      dockerfile: apps/analytics-ui/Dockerfile
      args:
        NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-http://localhost:${ANALYTICS_API_PORT:-8000}}
    container_name: climatesense-analytics-ui
    depends_on:
      - analytics-api
    ports:
      - "${ANALYTICS_UI_PORT:-3000}:3000"
    restart: unless-stopped
