volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: climatesense-postgres
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climatesense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-climatesense}",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${PIPELINE_UID:-1000}
        APP_GID: ${PIPELINE_GID:-1000}
    container_name: climatesense-pipeline
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-climatesense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CIMPLE_FACTORS_API_URL: ${CIMPLE_FACTORS_API_URL:-}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../cache:/app/cache
      - ../config:/app/config:ro
      - ../samples:/app/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - manual

  analytics-api:
    build:
      context: ..
      dockerfile: docker/analytics-api.Dockerfile
    container_name: climatesense-analytics-api
    environment:
      ANALYTICS_SPARQL_ENDPOINT: ${ANALYTICS_SPARQL_ENDPOINT:-${QLEVER_ENDPOINT:-http://qlever:7019}}
      ANALYTICS_SPARQL_USER: ${ANALYTICS_SPARQL_USER:-}
      ANALYTICS_SPARQL_PASSWORD: ${ANALYTICS_SPARQL_PASSWORD:-}
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:-http://localhost:3000}
      ANALYTICS_SPARQL_TIMEOUT: ${ANALYTICS_SPARQL_TIMEOUT:-20}
      ANALYTICS_RESULT_CACHE_TTL: ${ANALYTICS_RESULT_CACHE_TTL:-300}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-climatesense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "${ANALYTICS_API_PORT:-8000}:8000"
    restart: unless-stopped

  analytics-ui:
    build:
      context: ..
      dockerfile: apps/analytics-ui/Dockerfile
      args:
        NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-http://localhost:${ANALYTICS_API_PORT:-8000}}
    container_name: climatesense-analytics-ui
    depends_on:
      - analytics-api
    ports:
      - "${ANALYTICS_UI_PORT:-3000}:3000"
    restart: unless-stopped

  workbench:
    image: ghcr.io/ehrhart/rdf-workbench:latest
    container_name: climatesense-workbench
    environment:
      TRIPLESTORE_PROVIDER: ${TRIPLESTORE_PROVIDER}
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT}
      SPARQL_TIMEOUT_MS: ${SPARQL_TIMEOUT_MS:-60000}
      WORKBENCH_NAME: ${WORKBENCH_NAME:-RDF Workbench}
      WORKBENCH_URL: ${WORKBENCH_URL:-http://localhost:${WORKBENCH_PORT:-3001}}
      RESOURCE_BASE_URI: ${RESOURCE_BASE_URI:-}
    ports:
      - "${WORKBENCH_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
