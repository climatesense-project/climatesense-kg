volumes:
  qlever_data:
  qlever-workbench-data:

services:
  qlever-volume-admin:
    image: alpine:3.22
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/index-next && chown 999:999 /data /data/index-next",
      ]
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
    restart: "no"

  qlever-index:
    image: docker.io/adfreiburg/qlever:commit-8d7945d
    container_name: climatesense-qlever-index
    entrypoint: bash
    working_dir: /data
    depends_on:
      qlever-volume-admin:
        condition: service_completed_successfully
    environment:
      QLEVER_INDEX_MEMORY: ${QLEVER_INDEX_MEMORY:-1G}
      QLEVER_FORCE_REBUILD: ${QLEVER_FORCE_REBUILD:-0}
    command:
      - -c
      - >-
        if [ -d /data/index-current ] && [ $${QLEVER_FORCE_REBUILD:-0} != 1 ]; then
        echo index-current-present-nothing-to-do;
        exit 0;
        fi;
        rm -rf /data/index-next &&
        mkdir -p /data/index-next &&
        cp /config/Qleverfile /data/index-next/Qleverfile &&
        cd /data/index-next &&
        qlever index --stxxl-memory $${QLEVER_INDEX_MEMORY:-1G} &&
        cd /data &&
        rm -rf /data/index-previous &&
        { [ ! -d /data/index-current ] || mv /data/index-current /data/index-previous; } &&
        mv /data/index-next /data/index-current
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
      - ${QLEVER_DEPLOY_QLEVERFILE:-./qlever/Qleverfile}:/config/Qleverfile:ro
      - ../data:/data/source:ro
    restart: "no"

  qlever:
    image: docker.io/adfreiburg/qlever:commit-8d7945d
    container_name: climatesense-qlever
    entrypoint: bash
    working_dir: /data
    depends_on:
      qlever-volume-admin:
        condition: service_completed_successfully
      qlever-index:
        condition: service_completed_successfully
    environment:
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-}
      QLEVER_MEMORY_FOR_QUERIES: ${QLEVER_MEMORY_FOR_QUERIES:-5G}
      QLEVER_CACHE_MAX_SIZE: ${QLEVER_CACHE_MAX_SIZE:-2G}
      QLEVER_QUERY_TIMEOUT: ${QLEVER_QUERY_TIMEOUT:-30s}
    command:
      - -c
      - >-
        cd /data/index-current &&
        qlever start
        --run-in-foreground
        --access-token=${QLEVER_ACCESS_TOKEN:-}
        --memory-for-queries ${QLEVER_MEMORY_FOR_QUERIES:-5G}
        --cache-max-size ${QLEVER_CACHE_MAX_SIZE:-2G}
        --timeout ${QLEVER_QUERY_TIMEOUT:-30s}
    ports:
      - "${QLEVER_PORT:-7019}:7019"
    volumes:
      - type: volume
        source: qlever_data
        target: /data
        volume:
          nocopy: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -G -H 'Accept: application/sparql-results+json' --data-urlencode 'query=ASK { ?s ?p ?o }' http://localhost:7019 >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  workbench:
    environment:
      TRIPLESTORE_PROVIDER: qlever
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-${QLEVER_ENDPOINT:-http://qlever:7019}}
      WORKBENCH_DB_PATH: /data/workbench.sqlite
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-}
    volumes:
      - qlever-workbench-data:/data
