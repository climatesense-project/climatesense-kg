name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install analytics-ui dependencies
        working-directory: apps/analytics-ui
        run: npm ci
      - run: uv run pre-commit run --all-files

  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src services
      - run: uv run ty check
      - run: uv run ruff format --check src services

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short
      - name: Run Postgres integration tests
        env:
          TEST_POSTGRES_DB: climatesense_kg_test
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: postgres
        run: uv run pytest tests/integration -v --tb=short
        timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climatesense_kg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  analytics-ui:
    name: Analytics UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analytics-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/analytics-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build pipeline image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
      - name: Build analytics-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/analytics-api.Dockerfile
          push: false
      - name: Build analytics-ui image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/analytics-ui/Dockerfile
          push: false
